name: Exportar contactos CRM

on:
  push:
    branches:
      - tmp-export-contactos-20260727

permissions:
  contents: write

jobs:
  exportar:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer contactos del JSON embebido
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          html = Path('crm_app.html').read_text(encoding='utf-8')
          match = re.search(
              r'<script\s+id=["\']embeddedData["\']\s+type=["\']application/json["\']>(.*?)</script>',
              html,
              flags=re.S,
          )
          if not match:
              raise SystemExit('No se encontró embeddedData en crm_app.html')

          data = json.loads(match.group(1).strip())
          contacts = data.get('contacts') or data.get('contactos') or []

          headers = ['Institución', 'Tipo', 'Estado', 'Nombre', 'Puesto', 'Teléfono', 'Interés', 'Email']
          normalized = []
          for row in contacts:
              values = list(row) + [''] * (8 - len(row))
              normalized.append(values[:8])

          normalized.sort(key=lambda r: ((r[0] or '').casefold(), (r[3] or '').casefold()))

          with Path('contactos_crmsigma.csv').open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.writer(f)
              writer.writerow(headers)
              writer.writerows(normalized)

          records = [dict(zip(headers, row)) for row in normalized]
          Path('contactos_crmsigma.json').write_text(
              json.dumps(records, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          print(f'CONTACTOS_EXPORTADOS={len(normalized)}')
          PY

      - name: Publicar archivos en la rama temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contactos_crmsigma.csv contactos_crmsigma.json
          git commit -m "[skip ci] exportar contactos CRM" || exit 0
          git push

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: contactos-crmsigma
          path: |
            contactos_crmsigma.csv
            contactos_crmsigma.json
          if-no-files-found: error
