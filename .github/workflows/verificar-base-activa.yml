name: Verificar base activa CRM

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: read
  checks: read
  statuses: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar metadatos y API desplegada
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAIN_SHA: d4ba1a9ad11683a7f5dcca065c6d968b1d7fa1c0
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          sha = os.environ['MAIN_SHA']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'crm-verifier'
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          payload = {
              'repository': repo,
              'main_sha': sha,
              'deployments': [],
              'check_runs': [],
              'commit_statuses': [],
              'candidate_urls': [
                  'http://crmsigmaline.com', 'https://crmsigmaline.com',
                  'http://ventassigmaline.com', 'https://ventassigmaline.com'
              ],
              'api_results': []
          }

          try:
              deployments = get_json(f'https://api.github.com/repos/{repo}/deployments?per_page=100')
              for dep in deployments:
                  item = {
                      'id': dep.get('id'),
                      'environment': dep.get('environment'),
                      'created_at': dep.get('created_at'),
                      'sha': dep.get('sha'),
                      'statuses': []
                  }
                  try:
                      statuses = get_json(dep['statuses_url'])
                      for s in statuses:
                          item['statuses'].append({
                              'state': s.get('state'),
                              'environment_url': s.get('environment_url'),
                              'log_url': s.get('log_url'),
                              'target_url': s.get('target_url'),
                              'created_at': s.get('created_at')
                          })
                  except Exception as e:
                      item['statuses_error'] = str(e)
                  payload['deployments'].append(item)
          except Exception as e:
              payload['deployments_error'] = str(e)

          try:
              checks = get_json(f'https://api.github.com/repos/{repo}/commits/{sha}/check-runs?per_page=100')
              for c in checks.get('check_runs', []):
                  payload['check_runs'].append({
                      'name': c.get('name'),
                      'status': c.get('status'),
                      'conclusion': c.get('conclusion'),
                      'details_url': c.get('details_url'),
                      'html_url': c.get('html_url'),
                      'started_at': c.get('started_at'),
                      'completed_at': c.get('completed_at')
                  })
          except Exception as e:
              payload['checks_error'] = str(e)

          try:
              statuses = get_json(f'https://api.github.com/repos/{repo}/commits/{sha}/statuses?per_page=100')
              for s in statuses:
                  payload['commit_statuses'].append({
                      'context': s.get('context'),
                      'state': s.get('state'),
                      'target_url': s.get('target_url'),
                      'description': s.get('description'),
                      'created_at': s.get('created_at')
                  })
          except Exception as e:
              payload['statuses_error'] = str(e)

          url_re = re.compile(r'https?://[^\s"\']+')
          def walk(obj):
              if isinstance(obj, dict):
                  for v in obj.values(): walk(v)
              elif isinstance(obj, list):
                  for v in obj: walk(v)
              elif isinstance(obj, str):
                  for u in url_re.findall(obj):
                      u = u.rstrip('),.;]')
                      host = (urlsplit(u).hostname or '').lower()
                      if host and host not in {'github.com', 'api.github.com'}:
                          payload['candidate_urls'].append(u)
          walk(payload['deployments'])
          walk(payload['check_runs'])
          walk(payload['commit_statuses'])
          payload['candidate_urls'] = sorted(set(payload['candidate_urls']))

          tested = set()
          for url in payload['candidate_urls']:
              parsed = urlsplit(url)
              base = f'{parsed.scheme}://{parsed.netloc}'.rstrip('/')
              if base in tested: continue
              tested.add(base)
              api_url = base + '/api/data'
              result = {'base_url': base, 'api_url': api_url}
              try:
                  req = urllib.request.Request(api_url, headers={'User-Agent': 'crm-verifier'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      result['final_url'] = r.geturl()
                      result['http_status'] = r.status
                      result['content_type'] = r.headers.get('content-type')
                      data = json.loads(raw)
                      contacts = data.get('contactos') or data.get('contacts') or []
                      result['contacts_count'] = len(contacts)
                      result['clients_count'] = len(data.get('clientes') or data.get('clients') or [])
                      result['visits_count'] = len(data.get('visitas') or data.get('visits') or [])
              except Exception as e:
                  result['error'] = str(e)
              payload['api_results'].append(result)

          Path('verificacion_base_activa.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Subir verificación
        uses: actions/upload-artifact@v4
        with:
          name: verificacion-base-activa
          path: verificacion_base_activa.json
          if-no-files-found: error
